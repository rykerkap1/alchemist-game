<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Alchemist — What Would You Do?</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f5f0e6;color:#222}
main{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{width:min(900px,96vw);min-height:560px;background:#fff;border:2px solid #222;border-radius:10px;padding:44px;box-shadow:7px 7px 0 #222;display:flex;flex-direction:column;justify-content:center}
h1{font-size:50px;margin:0 0 10px}.sub{font-size:27px;margin-bottom:24px}.names{color:#555;margin-bottom:40px}
.kicker{font-size:14px;font-weight:bold;text-transform:uppercase;letter-spacing:1px;color:#766044;margin-bottom:12px}
h2{font-size:32px;line-height:1.18;margin:0 0 24px}.options{display:grid;grid-template-columns:1fr 1fr;gap:16px}
button{font:inherit;cursor:pointer;border:2px solid #222;border-radius:7px;background:#fff;padding:17px;font-weight:bold}
button:hover,.selected{background:#eee8dc}.primary{background:#222;color:#fff;align-self:flex-start;padding:15px 30px}
.option{text-align:left;min-height:105px;font-size:18px}.reveal{display:none;margin-top:24px;border-top:1px solid #bbb;padding-top:18px;line-height:1.45;font-size:18px}
.reveal.show{display:block}.analysis{background:#f5f0e6;padding:15px;border-radius:6px;margin-top:10px}
.finalq{font-size:22px;font-weight:bold;margin:17px 0}.nav{display:flex;justify-content:space-between;align-items:center;margin-top:22px}.progress{font-size:14px;color:#666}.small{font-size:16px;color:#555;line-height:1.5}
@media(max-width:650px){.card{padding:26px;min-height:650px}h1{font-size:39px}h2{font-size:27px}.options{grid-template-columns:1fr}}
</style></head><body><main><section class="card" id="card"></section></main>
<script>
const rounds=[
["You're halfway through college and realize you don't actually want the career you're studying for. What do you do?","Finish the degree. You've already come this far.","Change paths, even if it sets you back.","Santiago already has a comfortable life as a shepherd, but leaves it to chase something bigger.","Is leaving a stable life courageous, or irresponsible?"],
["You take a big risk on something you really want — and it goes badly. What now?","Cut your losses and go back to what was working.","Figure out what went wrong and keep going.","Santiago gets robbed in Tangier. Instead of giving up, he works at the crystal shop and keeps going.","At what point does persistence become recklessness?"],
["You get offered a safe job with decent money, but taking it probably means giving up your bigger goal.","Take the safe option.","Turn it down and keep chasing the bigger goal.","The Crystal Merchant chooses a safe, familiar life instead of pursuing his dream of going to Mecca.","Is choosing security actually a bad thing?"],
["There's no guarantee your biggest goal will work out. You could spend years on it and fail.","Some risks aren't worth taking.","Not trying would be worse.","Santiago never knows for sure that his journey will work. He keeps moving anyway.","Is a dream worth chasing if success isn't guaranteed?"],
["You have a goal you really care about, but your family thinks it's unrealistic.","Listen to them and choose something safer.","Go for it anyway.","Santiago has to choose his own path instead of living the life other people expect from him.","How much should other people's opinions affect your biggest decisions?"],
["You've spent a year chasing something and barely made progress.","Maybe it's time to move on.","Keep going. A year doesn't mean it won't work.","Santiago's journey takes longer and gets harder than he expected, but he keeps learning from it.","When does patience become wasting time?"],
["You finally become comfortable and successful, but you still haven't reached your original goal.","Stay. You already have a good life.","Leave and finish what you started.","Santiago becomes successful at the crystal shop and could stay, but chooses to continue toward the pyramids.","Would you risk a good life for the chance at a better one?"],
["Someone you trust tells you that you're making a huge mistake.","Take their advice.","Trust yourself.","Santiago hears plenty of reasons to stop, but ultimately has to decide what he believes for himself.","When should you listen to other people instead of yourself?"],
["You meet someone you really care about, but reaching your goal means leaving them for a while.","Stay with them.","Keep pursuing the goal and hope the relationship survives.","Santiago loves Fatima, but still leaves the oasis to continue toward the pyramids.","Should a relationship ever come before your biggest personal goal?"],
["You reach the end and realize what you were searching for was connected to where you started.","The journey was kind of pointless.","The journey was necessary to understand it.","Santiago's treasure is back in Spain, but he only learns where it is because of everything he experiences on the journey.","If you end up back where you started, was the journey still worth it?"]
];
let page=-1,choices=[];
function render(){
 const c=document.getElementById("card");
 if(page===-1){c.innerHTML=`<h1>The Alchemist</h1><div class="sub">What Would You Do?</div><div class="names">Ryker • Steve • Itay</div><p class="small">10 situations. Pick A or B. At the end, you'll get a result based on your choices.</p><button class="primary" onclick="page=0;render()">Start</button>`;return;}
 if(page<rounds.length){
  const r=rounds[page];
  c.innerHTML=`<div class="kicker">Situation ${page+1} of 10</div><h2>${r[0]}</h2><div class="options">
  <button class="option" onclick="pick(0,this)"><b>A</b><br><br>${r[1]}</button>
  <button class="option" onclick="pick(1,this)"><b>B</b><br><br>${r[2]}</button></div>
  <div class="reveal" id="reveal"><b>Connection to <i>The Alchemist</i></b><div class="analysis">${r[3]}</div><div class="finalq">${r[4]}</div></div>
  <div class="nav"><span class="progress">${page+1} / 10</span><button id="next" style="display:none" onclick="page++;render()">${page===9?"See Result":"Next →"}</button></div>`;return;
 }
 const score=choices.filter(x=>x===1).length; let title,desc;
 if(score>=9){title="🏆 THE ALCHEMIST";desc="You’re all-in. You’d rather risk comfort for the bigger goal than always wonder what could’ve happened."}
 else if(score>=7){title="🔥 THE DREAM CHASER";desc="You’ll take the risk when the goal matters enough. You’re a lot closer to Santiago than the Crystal Merchant."}
 else if(score>=4){title="⚖️ THE REALIST";desc="You believe in chasing goals, but not at any cost. You balance the dream with what could actually go wrong."}
 else{title="🏪 THE CRYSTAL MERCHANT";desc="You value stability more than uncertainty. That isn’t necessarily wrong — but it’s exactly the choice Coelho challenges in the novel."}
 c.innerHTML=`<div class="kicker">Your Result</div><h2>${title}</h2><div class="analysis" style="font-size:20px">${desc}</div>
 <p class="small" style="margin-top:18px">You chose the riskier path <b>${score} out of 10</b> times.</p>
 <div class="finalq">Which result did you get?</div><p class="small">Raise your hand when we call yours.<br><br><b>Which result do you think Coelho would say is the best way to live?</b></p>
 <button onclick="page=-1;choices=[];render()">Play Again</button>`;
}
function pick(v,el){choices[page]=v;document.querySelectorAll(".option").forEach(x=>x.classList.remove("selected"));el.classList.add("selected");document.getElementById("reveal").classList.add("show");document.getElementById("next").style.display="block";}
render();
</script></body></html>
